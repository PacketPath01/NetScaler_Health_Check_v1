[project]
name = "netscaler-healthcheck"
version = "1.0.0"
description = "Offline health checks and security advisory reports for NetScaler support bundles."
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
nshc = "nshc.cli:main"
nshc-gui = "nshc.gui:main"

[tool.setuptools.packages.find]
include = ["nshc*"]

[tool.setuptools.package-data]
nshc = ["data/*.json"]
